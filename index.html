<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DANTE — AFTER HOURS</title>
<style>
:root{
  --black:#000;--graphite:#141517;--graphite2:#1d1f22;--line:#2a2c30;
  --gold:#c8a24a;--gold-hi:#ecd592;--gold-lo:#7d6428;
  --text:#ebe8e0;--muted:#8e8b83;--danger:#c4584a;
  --serif:"Didot","Bodoni 72","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:-apple-system,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--black);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#1f1b12 0%,#0a0a0b 45%,#000 100%) fixed}
[hidden]{display:none!important}
.screen{min-height:100dvh;width:100%;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
h1,h2,h3{font-weight:400;margin:0}
h2{font-family:var(--serif);font-size:20px;color:var(--gold-hi);margin-bottom:12px}
p{margin:0 0 12px}
.muted{color:var(--muted)}.small{font-size:14px}

/* Botões */
.btn{display:block;width:100%;min-height:50px;padding:12px 18px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#120f05;font:600 16px var(--sans);letter-spacing:.02em;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--gold-hi);border-color:var(--gold-lo)}
.btn.danger{background:transparent;color:var(--danger);border-color:#5a2c26}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.stack>*+*{margin-top:12px}

/* Tela inicial */
#title{display:flex;flex-direction:column;justify-content:center;gap:48px}
.logo{text-align:center}
.logo h1{font-family:var(--serif);font-size:clamp(60px,22vw,104px);letter-spacing:.16em;padding-left:.16em;line-height:1;background:linear-gradient(180deg,var(--gold-hi) 10%,var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .sub{margin-top:14px;font-size:13px;letter-spacing:.62em;padding-left:.62em;color:var(--muted)}
.road{position:relative;height:1px;margin:28px auto 0;width:70%;background:var(--line);overflow:hidden}
.road::after{content:"";position:absolute;top:0;left:-30%;height:1px;width:30%;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);animation:sweep 2.6s ease-out 1 .4s forwards}
@keyframes sweep{to{left:100%}}
@media (prefers-reduced-motion:reduce){.road::after{animation:none;left:35%}}
.resume{border:1px solid var(--line);background:var(--graphite);border-radius:14px;padding:14px 16px}
.resume b{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--gold-hi)}

/* Cartões */
.card{background:var(--graphite);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card.dim{background:transparent;border-style:dashed}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
input,textarea,select{width:100%;background:var(--black);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:16px var(--sans)}
textarea{resize:none;min-height:84px}
.field{margin-bottom:16px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:4px 0 0}

/* Atributos */
.attr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.attr:first-of-type{border-top:0}
.attr .nm{font-weight:600}
.attr .ds{grid-column:1;font-size:13px;color:var(--muted)}
.pips{display:flex;gap:5px}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--graphite2);border:1px solid var(--line)}
.pips i.on{background:var(--gold);border-color:var(--gold)}
.ctrl{display:flex;align-items:center;gap:10px}
.ctrl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold-lo);background:transparent;color:var(--gold-hi);font-size:22px;cursor:pointer;touch-action:manipulation}
.ctrl button:disabled{opacity:.25}
.ctrl output{min-width:18px;text-align:center;font-weight:600}
.pool{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pool strong{font-family:var(--serif);font-size:28px;color:var(--gold-hi);font-weight:400}

/* Jogo */
#game{padding:0;max-width:480px}
.top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 10px;display:flex;justify-content:space-between;align-items:center}
.top .clock{font-family:var(--serif);font-size:26px;color:var(--gold-hi);line-height:1.1}
.top .day{font-size:13px;color:var(--muted);text-align:right}
.top-right{display:flex;align-items:center;gap:12px}
.top-menu{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--gold-lo);border-radius:12px;background:#17150f;color:var(--gold-hi);font-size:23px;line-height:1;cursor:pointer;touch-action:manipulation}
.top-menu:active{transform:scale(.96)}
.scene-combo{display:grid;grid-template-columns:1fr;gap:12px}
.scene-combo .field{margin:0}
.scene-combo textarea{min-height:76px}
.scene-combo-note{font-size:12px;color:var(--muted);margin:0 0 12px}
.busy-card{border-color:var(--gold);background:linear-gradient(145deg,#211d13,#141517)}.busy-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.busy-time{font-family:var(--serif);font-size:24px;color:var(--gold-hi)}.busy-track{height:6px;border-radius:99px;background:#2a2c30;overflow:hidden;margin:12px 0}.busy-track span{display:block;height:100%;background:var(--gold);transition:width .4s ease}
main{padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 100px)}
.who{font-family:var(--serif);font-size:28px;color:var(--gold-hi);line-height:1.15}
.bio{margin-top:10px;color:var(--text);font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
.date{font-family:var(--serif);font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
.list li:first-child{border-top:0}
.entry{padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry time{display:block;font-size:12px;color:var(--gold-lo)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;min-height:56px;background:none;border:0;color:var(--muted);font:500 14px var(--sans);cursor:pointer;border-top:2px solid transparent;touch-action:manipulation}
.nav button[aria-current="page"]{color:var(--gold-hi);border-top-color:var(--gold)}
.save{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 14px var(--sans);cursor:pointer;touch-action:manipulation}
.seg button[aria-pressed="true"]{color:var(--gold-hi);border-color:var(--gold);background:var(--graphite)}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.bal b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;color:var(--gold-hi);overflow-wrap:anywhere}
.gold{color:var(--gold-hi)}
.tx{padding:12px 0;border-top:1px solid var(--line)}.tx:first-child{border-top:0}
.tl{display:flex;justify-content:space-between;gap:12px}
.amt{font-weight:600;white-space:nowrap}.amt.income{color:#8fbf7a}.amt.expense{color:var(--danger)}.amt.transfer{color:var(--gold-hi)}
.crow{grid-column:1/-1;display:flex;gap:8px}.crow input{flex:1;min-width:0}.crow select{width:auto}.crow .btn{width:auto;min-height:48px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ev{border-color:var(--gold-lo);background:linear-gradient(180deg,#1b1810,var(--graphite))}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);max-width:448px;margin:0 auto;z-index:20;background:var(--graphite2);border:1px solid var(--gold-lo);border-radius:12px;padding:12px 16px;font-size:15px;text-align:center}
#toast.bad{border-color:var(--danger)}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:24px}
#modal .box{background:var(--graphite);border:1px solid var(--gold-lo);border-radius:16px;padding:20px;max-width:380px;width:100%}

/* ---------- Smartphone in-game ---------- */
#phoneLauncher{position:fixed;right:max(16px,calc((100vw - 480px)/2 + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 68px);z-index:8;width:54px;height:54px;border-radius:18px;border:1px solid var(--gold-lo);background:linear-gradient(145deg,#292a2d,#080809);color:var(--gold-hi);font-size:23px;box-shadow:0 8px 28px #0009;cursor:pointer;touch-action:manipulation}
#phoneLauncher:active{transform:scale(.96)}
#phoneOverlay{position:fixed;inset:0;z-index:50;background:#050506;display:flex;align-items:center;justify-content:center;padding:0}
#phoneDevice{position:relative;width:min(100vw,430px);height:min(100dvh,900px);min-height:540px;overflow:hidden;background:#08090c;border:1px solid #44464c;border-radius:42px;box-shadow:0 24px 80px #000b;color:#f7f5ef}
#phoneWallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,#39352c 0%,#171719 35%,#08090c 75%),linear-gradient(150deg,#24211a,#08090c);overflow:hidden}
#phoneWallpaper:before{content:"";position:absolute;width:125%;height:65%;left:-12%;bottom:-18%;border-radius:50%;border:1px solid #b99a5340;transform:rotate(-18deg);box-shadow:0 0 80px #c8a24a12}
#phoneWallpaper:after{content:"";position:absolute;width:85%;height:50%;left:8%;bottom:-16%;border-radius:50%;border:1px solid #ffffff16;transform:rotate(22deg)}
.phone-status{position:absolute;z-index:3;top:0;left:0;right:0;height:54px;padding:15px 25px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:650;letter-spacing:.02em}
.phone-island{position:absolute;z-index:5;top:10px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:20px;background:#000;border:1px solid #171719}
.phone-status-right{display:flex;gap:7px;align-items:center}
.phone-battery{width:19px;height:9px;border:1px solid #eee;border-radius:3px;position:relative}
.phone-battery:before{content:"";position:absolute;inset:1px 3px 1px 1px;background:#eee;border-radius:1px}
.phone-battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#eee;border-radius:0 2px 2px 0}
.phone-screen{position:absolute;inset:54px 0 30px;z-index:2;padding:18px 22px;overflow:auto}
#phoneLock{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:45px}
.phone-lock-date{font-size:15px;color:#e6dfce;letter-spacing:.04em}
.phone-lock-time{font-family:var(--serif);font-size:clamp(76px,22vw,104px);line-height:1.08;letter-spacing:-.05em;color:#fff;margin:4px 0 22px;font-weight:400}
.phone-lock-notice{width:100%;text-align:left;background:#ffffff16;border:1px solid #ffffff20;border-radius:17px;padding:13px 15px;margin-top:24px;backdrop-filter:blur(18px);font-size:13px}
.phone-lock-notice strong{display:block;font-size:12px;color:#e6d4a6;margin-bottom:4px;letter-spacing:.08em}
.phone-unlock{margin-top:auto;margin-bottom:22px;border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:24px;padding:12px 28px;font:600 14px var(--sans);min-height:46px}
.phone-home-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 24px}
.phone-home-head strong{font-family:var(--serif);font-size:23px;font-weight:400;letter-spacing:.08em}
.phone-home-head span{font-size:12px;color:#c7c2b7}
.phone-app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px 14px}
.phone-app{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:7px;font:12px var(--sans);min-width:0;cursor:pointer;touch-action:manipulation}
.phone-app-icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:27px;box-shadow:0 6px 18px #0006;border:1px solid #ffffff20}
.phone-app-icon.bank{background:linear-gradient(145deg,#e4c77b,#8c6825);color:#171207}
.phone-app-icon.whatsapp{background:linear-gradient(145deg,#287d55,#164b36)}
.phone-app-icon.settings{background:linear-gradient(145deg,#555b65,#24272e)}
.phone-app-icon.notes{background:linear-gradient(145deg,#d4d0c5,#77746d);color:#222}
.phone-dock{position:absolute;z-index:3;left:18px;right:18px;bottom:38px;min-height:82px;border:1px solid #ffffff25;border-radius:25px;background:#ffffff19;backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-evenly}
.phone-dock .phone-app-icon{width:49px;height:49px;border-radius:15px}
.phone-app-screen{position:absolute;inset:54px 0 30px;z-index:4;background:#08090c;overflow:auto;padding:18px 18px 30px}
.phone-appbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 22px}
.phone-appbar button{border:1px solid #4a4028;background:#17150f;color:var(--gold-hi);border-radius:12px;padding:9px 13px;font:13px var(--sans);min-height:40px}
.phone-appbar h3{font-family:var(--serif);font-size:23px;color:#f0d99f;font-weight:400}
.phone-bank-card{border:1px solid #8c7139;border-radius:20px;padding:20px;background:linear-gradient(135deg,#292319,#101114 75%);margin-bottom:15px}
.phone-bank-card .eyebrow{font-size:11px;letter-spacing:.16em;color:#c8ad6d}
.phone-bank-card .balance{font-family:var(--serif);font-size:31px;color:#f3e3b9;margin:7px 0}
.phone-bank-card .subbalance{font-size:12px;color:#aaa49a}
.phone-bank-row{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid #292a2d;font-size:13px}
.phone-bank-row:first-child{border-top:0}
.phone-bank-row b{font-weight:600;text-align:right}
.phone-empty{border:1px dashed #48433a;border-radius:16px;padding:20px;text-align:center;color:#aaa49a;font-size:13px}
.phone-home-indicator{position:absolute;z-index:10;bottom:9px;left:50%;transform:translateX(-50%);width:112px;height:5px;border-radius:5px;background:#fff;opacity:.8}
.phone-close{position:absolute;z-index:8;top:13px;right:15px;width:32px;height:32px;border:1px solid #ffffff30;border-radius:50%;background:#111a;color:#fff;font-size:18px}
.phone-back-home{display:block;width:100%;margin-top:22px;min-height:44px;border:1px solid #4a4028;border-radius:12px;background:#17150f;color:var(--gold-hi);font:14px var(--sans)}
.phone-placeholder{border:1px solid #2c2d31;background:#121316;border-radius:18px;padding:22px;text-align:center;margin-top:18px}
.phone-placeholder .big{font-size:38px;margin-bottom:12px}
.phone-placeholder h4{font-family:var(--serif);font-size:22px;color:#ecd592;font-weight:400;margin:0 0 8px}
.phone-placeholder p{font-size:13px;color:#aaa49a;line-height:1.6}
@media(max-width:480px){#phoneDevice{width:100vw;height:100dvh;min-height:0;border:0;border-radius:0}#phoneLauncher{right:16px}}
@media(min-width:481px){#phoneOverlay{background:#000e;padding:18px}}


/* ---------- Banco digital: identidade violeta ---------- */
.phone-app-icon.bank{background:linear-gradient(145deg,#9b35e8,#6a00b8);color:#fff}
.phone-app-icon svg{width:28px;height:28px;display:block}
#phoneLauncher{display:grid;place-items:center}
#phoneLauncher svg{width:25px;height:25px}
.phone-app-screen.nu-bank{padding:0;background:#f5f3f8;color:#241b2f;font-family:var(--sans)}
.nu-bank{min-height:100%;background:#f5f3f8;color:#241b2f;padding-bottom:30px}
.nu-header{background:linear-gradient(145deg,#8a05be,#5e00a5);color:#fff;padding:20px 20px 25px;border-radius:0 0 24px 24px}
.nu-topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 25px}
.nu-brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:750;letter-spacing:-.04em}
.nu-brand-mark{width:34px;height:34px;border-radius:11px;background:#fff;color:#7900b9;display:grid;place-items:center}
.nu-brand-mark svg{width:21px;height:21px}
.nu-avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ffffff25;border:1px solid #ffffff55;font-size:13px;font-weight:700}
.nu-greeting{font-size:14px;color:#f0dcfa;margin-bottom:3px}
.nu-headline{font-size:23px;font-weight:700;letter-spacing:-.04em}
.nu-balance-card{margin:-1px 16px 15px;position:relative;background:#fff;border-radius:18px;padding:19px 18px;box-shadow:0 5px 20px #2c144012}
.nu-label{font-size:13px;color:#6c6473}
.nu-balance-line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.nu-balance{font-size:30px;line-height:1.2;font-weight:750;letter-spacing:-.055em;color:#241b2f;overflow-wrap:anywhere}
.nu-eye{border:0;background:#f0eaf5;color:#6f00ad;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.nu-eye svg{width:19px;height:19px}
.nu-shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:3px 13px 19px}
.nu-shortcut{border:0;background:transparent;color:#2a2132;display:flex;flex-direction:column;align-items:center;gap:8px;font:600 11px var(--sans);padding:4px 0;min-width:0}
.nu-shortcut-icon{width:53px;height:53px;border-radius:50%;background:#e9e0f0;color:#7000aa;display:grid;place-items:center}
.nu-shortcut-icon svg{width:23px;height:23px}
.nu-section{padding:0 16px;margin:0 0 14px}
.nu-section-title{font-size:15px;font-weight:750;color:#292031;margin:0 0 9px}
.nu-white-card{background:#fff;border-radius:17px;padding:16px;box-shadow:0 3px 14px #2c14400a}
.nu-account-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #f0edf2;font-size:13px}
.nu-account-row:first-child{border-top:0;padding-top:0}
.nu-account-row:last-child{padding-bottom:0}
.nu-account-row span{color:#716a78}
.nu-account-row b{font-size:13px;color:#2c2334;text-align:right}
.nu-link{border:0;background:none;color:#7500b5;font:700 13px var(--sans);padding:8px 0}
.nu-transaction{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid #f0edf2}
.nu-transaction:first-child{border-top:0;padding-top:0}
.nu-tx-icon{width:38px;height:38px;flex:0 0 38px;border-radius:13px;background:#f0eaf5;color:#7500b5;display:grid;place-items:center}
.nu-tx-icon svg{width:18px;height:18px}
.nu-tx-info{min-width:0;flex:1}
.nu-tx-info b{display:block;font-size:13px;color:#2c2334;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nu-tx-info small{display:block;color:#89818e;font-size:11px;margin-top:2px}
.nu-tx-value{font-size:12px;font-weight:750;white-space:nowrap;color:#292031}
.nu-tx-value.in{color:#23834e}
.nu-form-wrap{padding:18px 16px}
.nu-back{border:0;background:transparent;color:#7200ae;font:700 13px var(--sans);padding:0;min-height:38px}
.nu-page-title{font-size:23px;line-height:1.2;font-weight:750;letter-spacing:-.04em;color:#2a2031;margin:14px 0 6px}
.nu-page-sub{font-size:13px;color:#756c7b;margin-bottom:20px}
.nu-field{margin:0 0 15px}
.nu-field label{display:block;color:#655c6e;font-size:12px;font-weight:650;margin:0 0 7px}
.nu-field input,.nu-field select{width:100%;border:1px solid #ded8e4;background:#fff;color:#2a2031;border-radius:12px;padding:14px;font:16px var(--sans);min-height:50px}
.nu-primary{width:100%;min-height:50px;border:0;border-radius:13px;background:#820ad1;color:#fff;font:700 15px var(--sans);box-shadow:0 5px 14px #820ad126;margin-top:5px}
.nu-primary:disabled{opacity:.45}

body{background:radial-gradient(ellipse at 50% -12%,#29251b 0%,#111113 42%,#09090a 100%);letter-spacing:.005em}

.nav button{font-size:12px;letter-spacing:.015em}

<div id="modal" role="dialog" aria-modal="true" hidden><div class="box"><p id="mText"></p><div class="row2"><button class="btn ghost" data-act="no">Cancelar</button><button class="btn" id="mYes" data-act="yes">Confirmar</button></div></div></div>

<script>
'use strict';
/* ==========================================================
   DANTE — AFTER HOURS  ·  v1.0
   Organização: Config → Util → Tempo → Estado/Salvamento →
   Ações do jogo → Views (registro) → Interface → Início
   Para criar um sistema novo: adicione um item em VIEWS e
   um campo ao estado (com migração em migrate()).
   ========================================================== */

/* ---------- Config ---------- */
const SAVE_KEY = 'dante_after_hours_save';
const SAVE_VERSION = 2;
const MAX_ATTR = 5, POOL = 10;
const ATTRS = [
  {id:'direcao',  nome:'Direção',   desc:'Controle do carro quando o ritmo aperta.'},
  {id:'mecanica', nome:'Mecânica',  desc:'Entender o que motor, câmbio e suspensão estão dizendo.'},
  {id:'carisma',  nome:'Carisma',   desc:'Fazer as pessoas quererem ouvir você.'},
  {id:'intelecto',nome:'Intelecto', desc:'Ler situações, números e pessoas.'},
  {id:'frieza',   nome:'Frieza',    desc:'Manter a cabeça fria sob pressão.'}
];
const PLANNED = ['Empregos fixos e salários','Garagem e carros','Locais e deslocamentos'];

/* ---------- Util ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

/* ---------- Tempo (minutos absolutos, em UTC) ---------- */
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DAY0 = Date.UTC(2027, 2, 5) / 60000;   // sexta-feira, 5 de março de 2027
const START = Date.UTC(2027, 2, 8) / 60000 + 17 * 60 + 3; // segunda-feira, 17:03
const asDate = m => new Date(m * 60000);
const fmtTime = m => { const d = asDate(m); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const fmtDate = m => { const d = asDate(m); return cap(DIAS[d.getUTCDay()]) + ', ' + d.getUTCDate() + ' de ' + MESES[d.getUTCMonth()] + ' de ' + d.getUTCFullYear(); };
const dayIndex = m => Math.floor((m - DAY0) / 1440);
const period = m => { const h = asDate(m).getUTCHours(); return h < 6 ? 'Madrugada' : h < 12 ? 'Manhã' : h < 18 ? 'Tarde' : 'Noite'; };

/* ---------- Estado e salvamento ---------- */
let G = null;            // estado do jogo
let storageOk = true;    // localStorage disponível?
let view = 'painel';
let draft = null;        // personagem em criação

try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { storageOk = false; }

function newGame(player) {
  const d = Object.assign({ v: SAVE_VERSION, player, time: START, diary: [], created: Date.now(), world: worldBlank(START) }, finBlank());
  return grantStartingBalance(migrate(d));
}
function grantStartingBalance(d) {
  if (!d || d.starterDepositGranted) return d;
  const amount = 35000; // US$ 350,00 em centavos
  if (!Number.isSafeInteger(d.bank) || d.bank < 0) d.bank = 0;
  if (d.bank + amount <= 99999999999) {
    d.bank += amount;
    if (!Array.isArray(d.tx)) d.tx = [];
    if (!Number.isSafeInteger(d.nextTx) || d.nextTx < 1) d.nextTx = 1;
    d.tx.push({ id: d.nextTx++, t: Number.isFinite(d.time) ? d.time : START, type: 'income', cat: 'Saldo inicial', desc: 'Depósito inicial', amt: amount, acc: 'bank', w: Number(d.wallet) || 0, b: d.bank });
    if (d.tx.length > 1000) d.tx.shift();
  }
  d.starterDepositGranted = true;
  return d;
}
function finBlank() {
  return { wallet: 0, bank: 0, totIn: 0, totOut: 0, tx: [], rec: [], pend: [], nextTx: 1, nextRec: 1, nextPend: 1 };
}
function migrate(d) {
  // v1 → v2: adiciona a economia (saldos zerados; nada é inventado).
  if (!d || typeof d !== 'object') return d;
  if (d.v === 1) d.v = 2;
  if (d.v === 2) {
    const n = x => (Number.isSafeInteger(x) && x >= 0 ? x : 0);
    const f = finBlank();
    ['wallet', 'bank', 'totIn', 'totOut'].forEach(k => { d[k] = n(d[k]); });
    ['tx', 'rec', 'pend'].forEach(k => { if (!Array.isArray(d[k])) d[k] = f[k]; });
    d.tx = d.tx.filter(x => x && Number.isFinite(x.t) && Number.isSafeInteger(x.amt) && ['income', 'expense', 'transfer'].includes(x.type) && typeof x.desc === 'string' && typeof x.cat === 'string' && typeof x.acc === 'string')
      .map(x => Object.assign(x, { w: n(x.w), b: n(x.b), id: n(x.id) }));
    d.rec = []; d.pend = [];   // v0.3: despesas recorrentes manuais foram removidas
    d.npcs = (Array.isArray(d.npcs) ? d.npcs : []).filter(q => q && typeof q.id === 'string' && typeof q.name === 'string' && typeof q.occ === 'string');
    if (!d.npcs.length) d.npcs = JSON.parse(JSON.stringify(NPC_SEED));
    d.npcs.forEach(q => { q.cash = n(q.cash); q.income = n(q.income); q.bond = clamp(Number(q.bond) || 0, 0, 100); q.gen = clamp(Number(q.gen) || 0, 0, 100); q.rel = clamp(Number(q.rel) || 0, 0, 100); q.cd = Number(q.cd) || 0; });
    // Acrescenta o elenco do RPG sem apagar NPCs ou relações de saves antigos.
    NPC_SEED.forEach(seed => {
      if (!d.npcs.some(q => q.id === seed.id)) d.npcs.push(JSON.parse(JSON.stringify(seed)));
    });
    d.npcs.forEach(q => { if (!q.locationId) q.locationId = npcDefaultLocation(q.id); });
    d.world = normalizeWorld(d.world, d.time);
    d.debts = (Array.isArray(d.debts) ? d.debts : []).filter(x => x && Number.isSafeInteger(x.amt) && x.amt > 0 && ['owe', 'owed'].includes(x.dir) && Number.isFinite(x.due) && d.npcs.some(q => q.id === x.npc)).map(x => Object.assign(x, { id: n(x.id), evt: !!x.evt }));
    d.events = (Array.isArray(d.events) ? d.events : []).filter(x => x && typeof x.type === 'string' && typeof x.txt === 'string' && Number.isFinite(x.t) && (!x.debt || d.debts.some(y => y.id === x.debt)) && (!x.npc || d.npcs.some(q => q.id === x.npc)));
    d.nextDebt = Math.max(n(d.nextDebt), d.debts.reduce((m, x) => Math.max(m, x.id), 0) + 1);
    d.nextEv = Math.max(n(d.nextEv), d.events.reduce((m, x) => Math.max(m, n(x.id)), 0) + 1);
    d.seed = Number.isInteger(d.seed) ? d.seed : (Date.now() & 0x7fffffff);
    d.lastMeal = Number.isInteger(d.lastMeal) ? d.lastMeal : -1;
    if (!d.lastPixReceipt || typeof d.lastPixReceipt !== 'object') d.lastPixReceipt = null;
    d.messages = (Array.isArray(d.messages) ? d.messages : []).filter(m => m && typeof m.npc === 'string' && ['player','npc'].includes(m.from) && typeof m.text === 'string' && Number.isFinite(m.t)).slice(-1000);
    d.nextMessageId = Math.max(n(d.nextMessageId), d.messages.reduce((m, x) => Math.max(m, n(x.id)), 0) + 1);
    d.nextTx = Math.max(n(d.nextTx), d.tx.reduce((m, x) => Math.max(m, x.id), 0) + 1);
    d.nextRec = Math.max(n(d.nextRec), d.rec.reduce((m, x) => Math.max(m, n(x.id)), 0) + 1);
    d.nextPend = Math.max(n(d.nextPend), d.pend.reduce((m, x) => Math.max(m, n(x.id)), 0) + 1);
  }
  return d;
}
function validSave(d) {
  return !!d && d.v === SAVE_VERSION && d.player && typeof d.player.name === 'string' &&
    d.player.attrs && typeof d.time === 'number' && isFinite(d.time) && Array.isArray(d.diary);
}
function loadSave() {
  if (!storageOk) return null;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = migrate(JSON.parse(raw));
    if (!validSave(d)) return null;
    ATTRS.forEach(a => { d.player.attrs[a.id] = clamp(Math.round(Number(d.player.attrs[a.id]) || 1), 1, MAX_ATTR); });
    grantStartingBalance(d);
    return d;
  } catch (e) { return null; }
}
function persist() {
  if (!storageOk || !G) return false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); return true; }
  catch (e) { storageOk = false; return false; }
}
function commit() {            // chamada após toda mudança de estado
  const ok = persist();
  $('#hSave').textContent = ok ? 'Salvo automaticamente' : 'Progresso não está sendo salvo';
  return ok;
}

/* ---------- Ações do jogo ---------- */
function remember(text, t) {
  G.diary.push({ t: t === undefined ? G.time : t, text });
  if (G.diary.length > 500) G.diary.shift();
}
function completeActiveAction() {
  const a = G && G.world && G.world.activeAction;
  if (!a) return;
  const t = G.time;
  const addLog = (kind, text) => {
    G.world.sceneLog.push({ id: G.world.nextSceneId++, kind, text, t });
    remember(text, t);
  };
  if (a.narration) addLog('narration', a.narration);
  (a.npcReactions || []).forEach(r => {
    const npc = G.npcs.find(q => q.id === r.npcId && q.locationId === G.world.locationId);
    if (npc && r.text) addLog('npc', r.text);
  });
  if (G.world.sceneLog.length > 300) G.world.sceneLog.splice(0, G.world.sceneLog.length - 300);
  G.world.activeAction = null;
  remember('Dante concluiu: ' + a.title + '.');
}
function advanceTime(mins) {
  if (!Number.isInteger(mins) || mins <= 0 || mins > 44640) return false;
  if (G.world && G.world.activeAction) {
    const remaining = G.world.activeAction.endTime - G.time;
    if (remaining <= 0) { completeActiveAction(); commit(); renderGame(); return false; }
    mins = Math.min(mins, remaining);
  }
  const t0 = G.time, before = dayIndex(G.time), ev0 = G.nextEv;
  G.time += mins;
  const after = dayIndex(G.time);
  for (let d = before + 1; d <= after; d++) remember('Começa o dia ' + (d + 1) + '.', DAY0 + d * 1440);
  worldTick(t0, G.time);
  const actionCompleted = !!(G.world && G.world.activeAction && G.time >= G.world.activeAction.endTime);
  if (actionCompleted) completeActiveAction();
  const ok = commit();
  updateClockDisplay();
  // A tela inteira só é reconstruída quando há uma mudança real de conteúdo.
  if (after !== before || actionCompleted || G.nextEv > ev0) renderGame();
  if (G.nextEv > ev0) toast('Algo aconteceu. Veja no topo da tela.');
  if (!ok) toast('Atenção: não foi possível salvar o progresso.', true);
  return true;
}
function minutesUntil(hour) {
  const m = ((G.time % 1440) + 1440) % 1440, target = hour * 60;
  return target > m ? target - m : 1440 - m + target;
}

/* ---------- Avisos internos ---------- */
let toastT = null, confirmCb = null;
function toast(msg, bad) {
  const el = $('#toast'); el.textContent = msg; el.className = bad ? 'bad' : ''; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3500);
}
function askConfirm(text, cb) { $('#mText').textContent = text; confirmCb = cb; $('#modal').hidden = false; $('#mYes').focus(); }

/* ---------- Economia ----------
   Fonte única da verdade: G.wallet e G.bank, em CENTAVOS (inteiros).
   A interface nunca altera saldos: só chama addMoney / spendMoney / transferMoney. */
const ACC = { wallet: 'Carteira', bank: 'Banco' };
const MAX_TX = 1000, MAX_CENTS = 99999999999;
const R = (ok, msg) => ({ ok, msg });
const fmtUSD = c => 'US$ ' + Math.floor(c / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad(c % 100);
const accName = a => a.split('>').map(x => ACC[x]).join(' → ');
function parseMoney(str) {
  const m = /^(\d{1,9})(?:[.,](\d{1,2}))?$/.exec(String(str).trim());
  if (!m) return NaN;
  const c = Number(m[1]) * 100 + Number((m[2] || '0').padEnd(2, '0'));
  return c > 0 && c <= MAX_CENTS ? c : NaN;
}
const validAmt = c => Number.isSafeInteger(c) && c > 0 && c <= MAX_CENTS;
function logTx(o) {
  G.tx.push({ id: G.nextTx++, t: o.t === undefined ? G.time : o.t, type: o.type, cat: o.cat, desc: o.desc, amt: o.amt, acc: o.acc, w: G.wallet, b: G.bank });
  if (G.tx.length > MAX_TX) G.tx.shift();
  if (!LOANCATS.has(o.cat)) { if (o.type === 'income') G.totIn += o.amt; else if (o.type === 'expense') G.totOut += o.amt; }
}
const finish = r => { if (!commit()) r.msg += ' Atenção: não foi possível salvar.'; return r; };
function addMoney(c, acc, desc, cat, t) {
  if (!ACC[acc] || !validAmt(c)) return R(false, 'Valor inválido.');
  if (G[acc] + c > MAX_CENTS) return R(false, 'Esse valor ultrapassa o saldo máximo.');
  G[acc] += c; logTx({ type: 'income', cat: cat || 'Recebimento', desc: desc || 'Recebimento', amt: c, acc, t });
  return finish(R(true, '+' + fmtUSD(c) + ' em ' + ACC[acc].toLowerCase() + '.'));
}
function spendMoney(c, acc, desc, cat, t) {
  if (!ACC[acc] || !validAmt(c)) return R(false, 'Valor inválido.');
  if (G[acc] < c) return R(false, 'Saldo insuficiente: ' + ACC[acc].toLowerCase() + ' tem ' + fmtUSD(G[acc]) + '.');
  G[acc] -= c; logTx({ type: 'expense', cat: cat || 'Despesa', desc: desc || 'Despesa', amt: c, acc, t });
  return finish(R(true, '−' + fmtUSD(c) + ' de ' + ACC[acc].toLowerCase() + '.'));
}
function transferMoney(c, from, to, cat) {
  if (!ACC[from] || !ACC[to] || from === to || !validAmt(c)) return R(false, 'Transferência inválida.');
  if (G[from] < c) return R(false, 'Saldo insuficiente: ' + ACC[from].toLowerCase() + ' tem ' + fmtUSD(G[from]) + '.');
  if (G[to] + c > MAX_CENTS) return R(false, 'Esse valor ultrapassa o saldo máximo.');
  G[from] -= c; G[to] += c;
  logTx({ type: 'transfer', cat: cat || 'Transferência', desc: ACC[from] + ' → ' + ACC[to], amt: c, acc: from + '>' + to });
  return finish(R(true, fmtUSD(c) + ': ' + ACC[from] + ' → ' + ACC[to] + '.'));
}
function getFinancialSummary() { return { wallet: G.wallet, bank: G.bank, total: G.wallet + G.bank, income: G.totIn, expense: G.totOut }; }
function getTransactionHistory(f) { return G.tx.filter(x => f === 'all' || x.type === f).sort((a, b) => b.t - a.t || b.id - a.id); }

/* ---------- Mundo: pessoas, dívidas e acontecimentos ----------
   Nada aqui mexe em saldo diretamente: tudo passa por addMoney / spendMoney / transferMoney. */
const LOANCATS = new Set(['Empréstimo', 'Empréstimo concedido', 'Dívida paga', 'Dívida recebida']);  // não contam como receita/despesa
const NPC_SEED = [
  { id: 'emily', name: 'Emily Carter', occ: 'Designer gráfica · 23 anos', cash: 85000, income: 420000, bond: 72, gen: 68, rel: 76, locationId: 'apartment_long_beach', role: 'Companheira; relação carinhosa em desenvolvimento' },
  { id: 'frank', name: 'Frank Miller', occ: 'Mecânico · chefe e mentor', cash: 180000, income: 620000, bond: 58, gen: 72, rel: 85, locationId: 'westside_auto_repair', gigs: true, role: 'Chefe de Dante na Westside Auto Repair' },
  { id: 'ryan', name: 'Ryan Mitchell', occ: 'Entusiasta automotivo', cash: 240000, income: 700000, bond: 68, gen: 76, rel: 70, locationId: 'off_scene', role: 'Amigo; proprietário de um Toyota Supra MK4' },
  { id: 'chris', name: 'Chris', occ: 'Possível cliente', cash: 300000, income: 0, bond: 25, gen: 55, rel: 50, locationId: 'off_scene', role: 'Possível cliente; proprietário de um Ford Mustang GT' }
];

const WORLD_PLACES = {
  apartment_long_beach: { name: 'Apartamento de Dante', area: 'Long Beach, Califórnia', description: 'Seu apartamento. Um espaço privado, longe do movimento da oficina.' },
  westside_auto_repair: { name: 'Westside Auto Repair', area: 'Los Angeles, Califórnia', description: 'A oficina onde Frank trabalha e orienta Dante.' },
  long_beach_streets: { name: 'Ruas de Long Beach', area: 'Long Beach, Califórnia', description: 'A cidade continua em movimento ao redor.' },
  rental_return: { name: 'Locadora', area: 'Long Beach, Califórnia', description: 'Local de devolução do veículo alugado.' },
  off_scene: { name: 'Fora de cena', area: 'Los Angeles, Califórnia', description: 'A pessoa está em outro lugar; sua posição atual ainda não foi estabelecida.' }
};

function npcDefaultLocation(id) {
  return ({ emily: 'apartment_long_beach', frank: 'westside_auto_repair', ryan: 'off_scene', chris: 'off_scene', marco: 'westside_auto_repair', lia: 'off_scene', vega: 'westside_auto_repair' })[id] || 'off_scene';
}
function worldBlank(t) {
  const now = Number.isFinite(t) ? t : START;
  let returnAt = Math.floor(now / 1440) * 1440 + 21 * 60;
  if (returnAt <= now) returnAt += 1440;
  return {
    locationId: 'apartment_long_beach',
    vehicle: { name: 'Hyundai Accent', year: 2019, status: 'Alugado', returnAt },
    sceneLog: [],
    nextSceneId: 1,
    createdAt: now
  };
}
function normalizeWorld(w, t) {
  const base = worldBlank(t);
  if (!w || typeof w !== 'object') return base;
  const validPlaces = Object.keys(WORLD_PLACES);
  if (!validPlaces.includes(w.locationId)) w.locationId = base.locationId;
  if (!w.vehicle || typeof w.vehicle !== 'object') w.vehicle = base.vehicle;
  else {
    w.vehicle.name = typeof w.vehicle.name === 'string' ? w.vehicle.name : base.vehicle.name;
    w.vehicle.year = Number.isInteger(w.vehicle.year) ? w.vehicle.year : base.vehicle.year;
    w.vehicle.status = typeof w.vehicle.status === 'string' ? w.vehicle.status : base.vehicle.status;
    w.vehicle.returnAt = Number.isFinite(w.vehicle.returnAt) ? w.vehicle.returnAt : base.vehicle.returnAt;
  }
  w.sceneLog = Array.isArray(w.sceneLog) ? w.sceneLog.filter(x => x && ['action','speech','player','narration','npc'].includes(x.kind) && typeof x.text === 'string' && Number.isFinite(x.t)).slice(-300) : [];
  w.nextSceneId = Math.max(Number.isSafeInteger(w.nextSceneId) ? w.nextSceneId : 1, w.sceneLog.reduce((m,x) => Math.max(m, Number(x.id)||0), 0) + 1);
  w.createdAt = Number.isFinite(w.createdAt) ? w.createdAt : base.createdAt;
  if (w.activeAction && typeof w.activeAction === 'object' && Number.isFinite(w.activeAction.endTime) && w.activeAction.endTime > (Number.isFinite(t) ? t : START)) {
    w.activeAction = {
      title: String(w.activeAction.title || 'Atividade em andamento').slice(0, 100),
      narration: String(w.activeAction.narration || '').slice(0, 2200),
      startTime: Number.isFinite(w.activeAction.startTime) ? w.activeAction.startTime : (Number.isFinite(t) ? t : START),
      endTime: Math.min(w.activeAction.endTime, (Number.isFinite(t) ? t : START) + 480),
      durationMinutes: clamp(Math.round(Number(w.activeAction.durationMinutes) || 1), 1, 480),
      npcReactions: Array.isArray(w.activeAction.npcReactions) ? w.activeAction.npcReactions.slice(0, 5).filter(x => x && typeof x.npcId === 'string' && typeof x.text === 'string').map(x => ({ npcId: x.npcId.slice(0, 40), text: x.text.slice(0, 500) })) : []
    };
  } else w.activeAction = null;

/* Conversa livre. Brain.interpret transforma texto em uma INTENÇÃO; só o motor mexe no dinheiro.
   Para usar IA no futuro, troque interpret/respond: a IA devolve intenções e o motor valida. */
const chat = {};
const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const Brain = {
  interpret(text) {
    const n = norm(text), m = /(\d+(?:[.,]\d{1,2})?)/.exec(n), amt = m ? parseMoney(m[1]) : NaN;

    if (/emprest/.test(n)) return { type: 'ask_loan', amt, wd: w ? ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'].indexOf(w[1]) : null };

  },
  respond(i, q) {
    if (i.type === 'ask_loan') {
      if (!validAmt(i.amt)) return 'Quanto você precisa?';
      if (G.debts.some(d => d.npc === q.id)) return 'Vamos acertar o que já está pendente antes.';
      const due = i.wd !== null ? nextWeekday(G.time, i.wd) : G.time + 7 * 1440;

      if (can >= i.amt) { const r = borrowMoney(q, i.amt, due); return r.ok ? 'Fechado. Me devolve até ' + fmtShort(due) + '.' : r.msg; }
      const part = Math.floor(can / 1000) * 1000;
      if (part >= 1000 && part >= i.amt * 0.4) { pushEv({ type: 'offer', npc: q.id, amt: part, due, exp: G.time + 1440, txt: q.name + ' só consegue emprestar ' + fmtUSD(part) + ' agora, para você devolver até ' + fmtShort(due) + '.' }, G.time); commit(); return 'Só consigo ' + fmtUSD(part) + '. Se servir, a oferta está no topo da tela.'; }
      return 'Estou sem folga agora.';
    }
    if (i.type === 'repay') {
      const d = G.debts.find(x => x.npc === q.id && x.dir === 'owe');
      if (!d) return 'Você não me deve nada.';
      const r = payDebt(d.id, isNaN(i.amt) ? d.amt : Math.min(i.amt, d.amt));
      return r.ok ? 'Recebido. Valeu.' : r.msg;

      recentScene: G.world.sceneLog.slice(-12).map(x => ({ kind: x.kind, text: x.text, time: fmtTime(x.t) }))
    };
    const response = await fetch('/.netlify/functions/game-ai', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Não foi possível consultar a IA.');
    if (G !== targetGame) return;
    const duration = clamp(Math.round(Number(data.durationMinutes) || 1), 1, 480);
    const title = String(data.activityTitle || 'Atividade de Dante').slice(0, 100);
    const narration = String(data.narration || 'A atividade foi concluída.').slice(0, 2200);
    const reactions = Array.isArray(data.npcReactions) ? data.npcReactions.slice(0, 5).map(x => ({ npcId: String(x.npcId || '').slice(0, 40), text: String(x.text || '').slice(0, 500) })).filter(x => x.npcId && x.text && G.npcs.some(q => q.id === x.npcId && q.locationId === G.world.locationId)) : [];
    if (!addSceneEntries(message)) throw new Error('Escreva o que Dante faz ou diz.');
    G.world.activeAction = { title, narration, startTime: G.time, endTime: G.time + duration, durationMinutes: duration, npcReactions: reactions };
    remember('Começou a atividade: ' + title + ' (aproximadamente ' + duration + ' minutos).');
    commit();
    renderGame();
    toast(`Dante ficará ocupado por ${duration} minuto${duration === 1 ? '' : 's'}.`);
  } catch (err) {
    if (G === targetGame) {
      renderGame();
      toast(err && err.message ? err.message : 'Falha ao conectar com a IA. Tente novamente.', true);
    }
  } finally {
    sceneRequestPending = false;
  }
}

/* ---------- Interface ---------- */
let realtimeTimer = null;
let realtimeLastAt = null;
let realtimeCarryMs = 0;
function startRealtimeClock() {
  if (realtimeTimer !== null) return;
  realtimeLastAt = Date.now();
  realtimeTimer = setInterval(() => {
    if (!G || $('#game').hidden || document.hidden) {
      realtimeLastAt = null;
      return;
    }
    const now = Date.now();
    if (realtimeLastAt === null) {
      realtimeLastAt = now;
      return;
    }
    const elapsed = now - realtimeLastAt;
    realtimeLastAt = now;
    // Evita contabilizar o período em que o Safari suspendeu a página.
    if (elapsed < 0 || elapsed > 15000) return;
    realtimeCarryMs += elapsed;
    const minutes = Math.floor(realtimeCarryMs / 10000);
    if (minutes > 0) {
      realtimeCarryMs %= 10000;
      advanceTime(minutes);
    }
  }, 1000);
}
function stopRealtimeClock() {
  if (realtimeTimer !== null) clearInterval(realtimeTimer);
  realtimeTimer = null;
  realtimeLastAt = null;
}
document.addEventListener('visibilitychange', () => {
  // Ao voltar ao Safari, começa uma nova contagem; não recupera tempo offline.
  realtimeLastAt = document.hidden ? null : Date.now();
});
function show(id) {
  if (id === 'game') startRealtimeClock();
  else stopRealtimeClock();
  $('#phoneLauncher').hidden = id !== 'game';
  if (id !== 'game') closePhone();
  ['title', 'create', 'game'].forEach(s => { $('#' + s).hidden = s !== id; });
  window.scrollTo(0, 0);
}
function renderTitle() {
  const s = loadSave();
  $('#resume').hidden = $('#btnContinue').hidden = !s;
  if (s) $('#resume').innerHTML = `<b>${esc(s.player.name)}</b><div class="muted small">Dia ${dayIndex(s.time) + 1} · ${fmtTime(s.time)}</div>`;
  $('#storageWarn').hidden = storageOk;
  show('title');
}

  if (!G) return;

function startCreate() {

  $('#inName').value = 'Dante'; $('#inAge').value = 21; $('#inBio').value = 'Mecânico e motorista de aplicativo temporário. Reservado, observador e independente.';
  $('#createErr').textContent = '';

    <div class="attr" data-id="${a.id}">

      <span class="ctrl"><button type="button" data-act="attr" data-id="${a.id}" data-d="-1" aria-label="Diminuir ${a.nome}">−</button><output></output><button type="button" data-act="attr" data-id="${a.id}" data-d="1" aria-label="Aumentar ${a.nome}">+</button></span>
      <span class="ds">${a.desc}</span>
    </div>`).join('');
  updateCreate();
  show('create');
}
function spent() { return ATTRS.reduce((t, a) => t + draft.attrs[a.id] - 1, 0); }
function updateCreate() {
  const left = POOL - spent();
  $('#pool').textContent = left;
  ATTRS.forEach(a => {
    const row = $('.attr[data-id="' + a.id + '"]');
    const v = draft.attrs[a.id];
    $('output', row).textContent = v;
    const [minus, plus] = row.querySelectorAll('button');
    minus.disabled = v <= 1;
    plus.disabled = v >= MAX_ATTR || left <= 0;
  });
}
function finishCreate() {
  const name = $('#inName').value.trim().replace(/\s+/g, ' ');
  const age = Math.round(Number($('#inAge').value));
  const bio = $('#inBio').value.trim().slice(0, 160);
  const err = $('#createErr');
  if (name.length < 2) { err.textContent = 'Escolha um nome com pelo menos 2 letras.'; $('#inName').focus(); return; }
  if (!isFinite(age) || age < 18 || age > 80) { err.textContent = 'A idade precisa estar entre 18 e 80 anos.'; $('#inAge').focus(); return; }
  if (spent() !== POOL) { err.textContent = 'Distribua todos os pontos de atributo antes de começar.'; return; }
  err.textContent = '';
  G = newGame({ name, age, bio, attrs: Object.assign({}, draft.attrs) });
  remember('Início da sua história. Sexta-feira à noite.');
  enterGame();
}

    eyeoff: '<path d="m3 3 18 18M10.6 6.2A10 10 0 0 1 12 6c6.2 0 9.5 6 9.5 6a14 14 0 0 1-3 3.6M6.2 6.3C3.8 8 2.5 12 2.5 12s3.3 6 9.5 6c1.5 0 2.8-.4 4-1"/>',

    arrow: '<path d="M5 12h14m-6-6 6 6-6 6"/>',
    bank: '<path d="m3 9 9-6 9 6H3Z"/><path d="M5 10v8m4-8v8m6-8v8m4-8v8M3 20h18"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.arrow}</svg>`;
}
function bankMoney(c) { return bankHideBalance ? '••••••' : fmtUSD(c); }
function bankBackButton(label='Voltar', target='home') { return `<button class="nu-back" type="button" data-bank-page="${target}">‹ ${label}</button>`; }
function bankTxRows(rows) {
  if (!rows.length) return '<div class="nu-empty">Nenhuma movimentação por enquanto.</div>';
  return rows.map(x => {
    const sign = x.type === 'income' ? '+' : x.type === 'expense' ? '−' : '';
    const cls = x.type === 'income' ? 'in' : '';
    const icon = x.type === 'income' ? 'arrow' : x.type === 'expense' ? 'arrow' : 'bank';
    return `<div class="nu-transaction"><span class="nu-tx-icon">${bankIcon(icon)}</span><span class="nu-tx-info"><b>${esc(x.desc)}</b><small>${esc(x.cat)} · ${fmtShort(x.t)} às ${fmtTime(x.t)}</small></span><span class="nu-tx-value ${cls}">${sign}${fmtUSD(x.amt)}</span></div>`;
  }).join('');
}
function renderBankApp(page) {
  bankPage = page || 'home';
  const app = $('#phoneAppScreen');
  app.className = 'phone-app-screen nu-bank';
  const f = getFinancialSummary();
  if (bankPage === 'home') {
    const recent = getTransactionHistory('all').slice(0,4);
    const firstName = G.player.name.split(/\s+/)[0];
    app.innerHTML = `<div class="nu-bank">
      <header class="nu-header"><div class="nu-topline"><div class="nu-brand"><span class="nu-brand-mark">${bankIcon('bank')}</span><span>nu.</span></div><span class="nu-avatar">${esc(firstName.slice(0,1).toUpperCase())}</span></div><div class="nu-greeting">Olá, ${esc(firstName)}</div><div class="nu-headline">Como estão suas finanças?</div></header>
      <section class="nu-balance-card"><div class="nu-label">Saldo em conta</div><div class="nu-balance-line"><strong class="nu-balance">${bankMoney(f.bank)}</strong><button class="nu-eye" type="button" data-bank-action="toggle-balance" aria-label="Mostrar ou ocultar saldo">${bankIcon(bankHideBalance?'eyeoff':'eye')}</button></div></section>
      <div class="nu-shortcuts">
        <button class="nu-shortcut" type="button" data-bank-page="pix"><span class="nu-shortcut-icon">${bankIcon('pix')}</span><span>Fazer Pix</span></button>
        <button class="nu-shortcut" type="button" data-bank-page="deposit"><span class="nu-shortcut-icon">${bankIcon('deposit')}</span><span>Depositar</span></button>
        <button class="nu-shortcut" type="button" data-bank-page="withdraw"><span class="nu-shortcut-icon">${bankIcon('withdraw')}</span><span>Retirar</span></button>
        <button class="nu-shortcut" type="button" data-bank-page="history"><span class="nu-shortcut-icon">${bankIcon('history')}</span><span>Extrato</span></button>
      </div>
      <section class="nu-section"><h4 class="nu-section-title">Minha conta</h4><div class="nu-white-card"><div class="nu-account-row"><span>Saldo em conta</span><b>${bankMoney(f.bank)}</b></div><div class="nu-account-row"><span>Dinheiro na carteira</span><b>${bankMoney(f.wallet)}</b></div><div class="nu-account-row"><span>Patrimônio total</span><b>${bankMoney(f.total)}</b></div></div></section>
      <section class="nu-section"><div style="display:flex;justify-content:space-between;align-items:center"><h4 class="nu-section-title">Últimas movimentações</h4><button class="nu-link" type="button" data-bank-page="history">Ver extrato</button></div><div class="nu-white-card">${bankTxRows(recent)}</div></section>
      <div class="nu-foot">DANTE BANK · CONTA DIGITAL DO UNIVERSO DANTE</div>
    </div>`;
  } else if (bankPage === 'pix') {
    const opts = G.npcs.map(q => `<option value="${esc(q.id)}">${esc(q.name)} · ${esc(q.occ)}</option>`).join('');
    app.innerHTML = `<div class="nu-bank"><div class="nu-form-wrap">${bankBackButton()}<h2 class="nu-page-title">Fazer Pix</h2><p class="nu-page-sub">Transfira dinheiro da sua conta para alguém do seu círculo.</p><div class="nu-white-card" style="margin-bottom:16px"><div class="nu-label">Saldo disponível</div><div style="font-size:21px;font-weight:800;margin-top:4px">${bankMoney(f.bank)}</div></div><div class="nu-field"><label for="nuPixTo">Quem vai receber?</label><select id="nuPixTo"><option value="">Selecione uma pessoa</option>${opts}</select></div><div class="nu-field"><label for="nuPixAmount">Valor da transferência</label><input id="nuPixAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></div><div class="nu-field"><label for="nuPixDesc">Descrição (opcional)</label><input id="nuPixDesc" type="text" maxlength="48" placeholder="Ex.: acerto, ajuda, pagamento"></div><div class="nu-note">O Pix será descontado do saldo bancário e creditado ao dinheiro disponível do destinatário. Confira os dados antes de confirmar.</div><button class="nu-primary" type="button" data-bank-action="pix-submit">Continuar</button></div></div>`;
  } else if (bankPage === 'pix-review') {
    const draft = bankPixDraft;
    if (!draft) { renderBankApp('pix'); return; }
    const recipient = npcOf(draft.to);
    app.innerHTML = `<div class="nu-bank"><div class="nu-form-wrap">${bankBackButton('Editar Pix','pix')}<h2 class="nu-page-title">Confira os dados</h2><p class="nu-page-sub">Revise a transferência antes de confirmar.</p><div class="nu-receipt"><div class="nu-label">Valor do Pix</div><div class="nu-receipt-amount">${fmtUSD(draft.amount)}</div><div class="nu-receipt-detail"><span>Para</span><b>${esc(recipient ? recipient.name : 'Destinatário')}</b></div><div class="nu-receipt-detail"><span>Instituição</span><b>DANTE BANK</b></div><div class="nu-receipt-detail"><span>Descrição</span><b>${esc(draft.description || 'Pix enviado')}</b></div><div class="nu-receipt-detail"><span>Origem</span><b>Saldo da conta</b></div></div><div class="nu-note">Ao confirmar, o valor será descontado da sua conta e adicionado ao dinheiro do destinatário. Essa operação não pode ser desfeita.</div><button class="nu-primary" type="button" data-bank-action="pix-confirm">Confirmar Pix</button><button class="nu-secondary" type="button" data-bank-page="pix">Cancelar</button></div></div>`;
  } else if (bankPage === 'deposit' || bankPage === 'withdraw') {
    const dep = bankPage === 'deposit';
    const from = dep ? f.wallet : f.bank;
    app.innerHTML = `<div class="nu-bank"><div class="nu-form-wrap">${bankBackButton()}<h2 class="nu-page-title">${dep?'Depositar dinheiro':'Retirar dinheiro'}</h2><p class="nu-page-sub">${dep?'Transfira dinheiro da carteira para sua conta.':'Transfira dinheiro da conta para sua carteira.'}</p><div class="nu-white-card" style="margin-bottom:16px"><div class="nu-label">${dep?'Disponível na carteira':'Disponível na conta'}</div><div style="font-size:21px;font-weight:800;margin-top:4px">${bankMoney(from)}</div></div><div class="nu-field"><label for="nuMoveAmount">Valor</label><input id="nuMoveAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></div><button class="nu-primary" type="button" data-bank-action="${dep?'deposit-submit':'withdraw-submit'}">${dep?'Depositar':'Retirar'}</button></div></div>`;
  } else if (bankPage === 'history') {
    const all = getTransactionHistory(bankFilter).slice(0,100);
    const filters = [['all','Tudo'],['income','Entradas'],['expense','Saídas'],['transfer','Transferências']];
    app.innerHTML = `<div class="nu-bank"><div class="nu-form-wrap">${bankBackButton()}<h2 class="nu-page-title">Extrato</h2><p class="nu-page-sub">Todas as movimentações da sua conta e carteira.</p><div class="nu-filter">${filters.map(([k,l])=>`<button type="button" data-bank-filter="${k}" aria-pressed="${k===bankFilter}">${l}</button>`).join('')}</div><div class="nu-white-card">${bankTxRows(all)}</div>${getTransactionHistory(bankFilter).length>100?'<p class="nu-foot">Exibindo as 100 movimentações mais recentes.</p>':''}</div></div>`;
  } else if (bankPage === 'receipt') {
    const r = G.lastPixReceipt;
    if (!r) { app.innerHTML = `<div class="nu-bank"><div class="nu-form-wrap">${bankBackButton()}<div class="nu-empty">Nenhum comprovante disponível.</div></div></div>`; return; }
    app.innerHTML = `<div class="nu-bank"><div class="nu-form-wrap">${bankBackButton()}<div class="nu-receipt"><div class="nu-receipt-check">${bankIcon('check')}</div><div style="font-size:15px;font-weight:800">Pix realizado</div><div class="nu-label">Transferência concluída</div><div class="nu-receipt-amount">${fmtUSD(r.amount)}</div><div class="nu-receipt-detail"><span>Para</span><b>${esc(r.recipientName)}</b></div><div class="nu-receipt-detail"><span>Descrição</span><b>${esc(r.description||'Pix enviado')}</b></div><div class="nu-receipt-detail"><span>Data</span><b>${fmtShort(r.t)} · ${fmtTime(r.t)}</b></div><div class="nu-receipt-detail"><span>Conta de origem</span><b>DANTE BANK</b></div><div class="nu-receipt-detail"><span>Identificador</span><b>${String(r.txId).padStart(6,'0')}</b></div></div><button class="nu-secondary" type="button" data-bank-page="home">Voltar ao início</button></div></div>`;
  }
}
function bankDoPix() {
  const to = $('#nuPixTo').value;
  const raw = $('#nuPixAmount').value;
  const desc = $('#nuPixDesc').value.trim().slice(0,48);
  const q = npcOf(to);
  const amount = parseMoney(raw);
  if (!q) return toast('Selecione quem vai receber o Pix.', true);
  if (!validAmt(amount)) return toast('Informe um valor válido.', true);
  if (G.bank < amount) return toast('Saldo bancário insuficiente.', true);
  if (q.cash + amount > MAX_CENTS) return toast('O destinatário não pode receber esse valor.', true);
  bankPixDraft = { to: q.id, amount, description: desc };
  renderBankApp('pix-review');
}
function bankConfirmPix() {
  const draft = bankPixDraft;
  if (!draft) return toast('Não há Pix para confirmar.', true);
  const q = npcOf(draft.to), amount = draft.amount;
  if (!q) return toast('Destinatário não encontrado.', true);
  if (!validAmt(amount) || G.bank < amount) return toast('Saldo bancário insuficiente ou valor inválido.', true);
  if (q.cash + amount > MAX_CENTS) return toast('O destinatário não pode receber esse valor.', true);
  const result = spendMoney(amount, 'bank', 'Pix para ' + q.name, 'Pix enviado');
  if (!result.ok) return toast(result.msg, true);
  q.cash += amount;
  remember('Você enviou ' + fmtUSD(amount) + ' por Pix para ' + q.name + (draft.description ? ' (' + draft.description + ')' : '') + '.');
  const tx = G.tx[G.tx.length - 1];
  G.lastPixReceipt = { txId: tx ? tx.id : G.nextTx - 1, t: G.time, recipient: q.id, recipientName: q.name, amount, description: draft.description || 'Pix enviado' };
  bankPixDraft = null;
  commit();
  renderBankApp('receipt');
  toast('Pix enviado com sucesso.');
}
function bankMoveMoney(kind) {
  const amount = parseMoney($('#nuMoveAmount').value);
  if (!validAmt(amount)) return toast('Informe um valor válido.', true);
  const result = kind === 'deposit'
    ? transferMoney(amount, 'wallet', 'bank', 'Depósito')
    : transferMoney(amount, 'bank', 'wallet', 'Retirada');
  if (!result.ok) return toast(result.msg, true);
  renderBankApp('home');
  toast(kind === 'deposit' ? 'Dinheiro depositado.' : 'Dinheiro retirado.');
}


/* Eventos (delegação) */

document.addEventListener('click', ev => {
  if (G && G.world && G.world.activeAction && ev.target.closest('#phoneLauncher,[data-app],[data-wa],[data-bank-page],[data-bank-filter],[data-bank-action]')) { toast('Dante está ocupado até concluir a atividade.', true); return; }
  if (ev.target.closest('#phoneLauncher')) { openPhone(); return; }
  const pbtn = ev.target.closest('[data-phone]');
  if (pbtn) {
    const action = pbtn.dataset.phone;
    if (action === 'close') closePhone();
    else if (action === 'unlock' || action === 'home') phoneHome();
    return;
  }
  const app = ev.target.closest('[data-app]');
  if (app) { openPhoneApp(app.dataset.app); return; }
  const waButton = ev.target.closest('[data-wa]');
  if (waButton) {
    if (waButton.dataset.wa === 'list') renderWhatsApp('list');
    else if (waButton.dataset.wa === 'chat') renderWhatsApp('chat', waButton.dataset.id);
    return;
  }
  const bankPageButton = ev.target.closest('[data-bank-page]');
  if (bankPageButton) { renderBankApp(bankPageButton.dataset.bankPage); return; }
  const bankFilterButton = ev.target.closest('[data-bank-filter]');
  if (bankFilterButton) { bankFilter = bankFilterButton.dataset.bankFilter; renderBankApp('history'); return; }
  const bankActionButton = ev.target.closest('[data-bank-action]');
  if (bankActionButton) {
    const action = bankActionButton.dataset.bankAction;
    if (action === 'toggle-balance') { bankHideBalance = !bankHideBalance; renderBankApp('home'); }
    else if (action === 'pix-submit') bankDoPix();
    else if (action === 'pix-confirm') bankConfirmPix();
    else if (action === 'deposit-submit') bankMoveMoney('deposit');
    else if (action === 'withdraw-submit') bankMoveMoney('withdraw');
    return;
  }
});

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (G && G.world && G.world.activeAction && !['nav','menu'].includes(act)) { toast('Dante está ocupado até concluir a atividade.', true); return; }
  if (act === 'continue') { const s = loadSave(); if (s) { G = s; enterGame(); } else renderTitle(); }
  else if (act === 'new') {
    if (loadSave()) askConfirm('Já existe um jogo salvo. Ele só será substituído quando você terminar de criar o novo personagem. Continuar?', startCreate);
    else startCreate();
  }
  else if (act === 'back') renderTitle();
  else if (act === 'attr') {
    const id = el.dataset.id, d = Number(el.dataset.d), v = draft.attrs[id] + d;
    if (v < 1 || v > MAX_ATTR || (d > 0 && spent() >= POOL)) return;
    draft.attrs[id] = v; updateCreate();
  }
  else if (act === 'start') finishCreate();
  else if (act === 'nav') { view = el.dataset.v; renderGame(); window.scrollTo(0, 0); }
  else if (act === 'adv') advanceTime(el.dataset.m === 'until6' ? minutesUntil(6) : Number(el.dataset.m));
  else if (act === 'advc') customAdvance();
  else if (act === 'yes') { $('#modal').hidden = true; const cb = confirmCb; confirmCb = null; if (cb) cb(); }
  else if (act === 'no') { $('#modal').hidden = true; confirmCb = null; }
  else if (act === 'fsub') { fsub = el.dataset.k; renderGame(); }
  else if (act === 'ffil') { ffilter = el.dataset.k; renderGame(); }
  else if (act === 'ev') resolveEv(Number(el.dataset.id), el.dataset.k);
  else if (act === 'talk') talk(el.dataset.id);
  else if (act === 'paydebt') { const d = G.debts.find(x => x.id === Number(el.dataset.id)); const r = d ? payDebt(d.id, d.amt) : R(false, 'Dívida não encontrada.'); toast(r.msg, !r.ok); renderGame(); }
  else if (act === 'atm') { const c = parseMoney($('#atmAmt').value); const r = isNaN(c) ? R(false, 'Informe um valor válido.') : el.dataset.k === 'dep' ? transferMoney(c, 'wallet', 'bank', 'Depósito') : transferMoney(c, 'bank', 'wallet', 'Saque'); toast(r.msg, !r.ok); if (r.ok) renderGame(); }
  else if (act === 'menu') { renderTitle(); }
  else if (act === 'wipe') {
    askConfirm('Apagar este jogo salvo? Isso não pode ser desfeito.', () => {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      G = null; renderTitle();
    });
  }
});

document.addEventListener('submit', ev => {
  if (ev.target && ev.target.id === 'waCompose') {
    ev.preventDefault();
    if (G && G.world && G.world.activeAction) { toast('Dante está ocupado até concluir a atividade.', true); return; }
    waSendMessage();
  } else if (ev.target && ev.target.id === 'sceneEntryForm') {
    ev.preventDefault();
    const message = $('#sceneMessage').value;
    if (!message.trim()) { toast('Escreva o que Dante faz ou diz.', true); return; }
    submitSceneToAI(message);
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#phoneOverlay').hidden) closePhone();
  if (ev.key === 'Enter' && ev.target.id && ev.target.id.startsWith('tk-')) talk(ev.target.id.slice(3));
});

/* ---------- Início ---------- */
renderTitle();
</script>
</body>
</html>
